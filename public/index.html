<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Life · kamradtfamily.net</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307090c'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='18' font-weight='bold' fill='%2300ccff'>RK</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #020408;
  --surface:   rgba(0,229,255,0.04);
  --border:    rgba(0,229,255,0.18);
  --border-hi: rgba(0,229,255,0.55);
  --cyan:      #00e5ff;
  --green:     #00e676;
  --amber:     #ffab40;
  --red:       #ff1744;
  --text:      #b2dfdb;
  --dim:       #4a6572;
  --font:      'Courier New', Courier, monospace;
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 12px;
  user-select: none;
}

/* ── Header ─────────────────────────────────────── */
header {
  height: 44px; padding: 0 16px;
  display: flex; align-items: center; gap: 20px;
  background: rgba(2,4,8,0.97); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 10;
}
.logo {
  font-size: 16px; font-weight: bold; color: var(--cyan);
  text-shadow: 0 0 20px rgba(0,229,255,0.5); letter-spacing: 2px;
}
.stats { display: flex; gap: 20px; flex: 1; }
.stat  { display: flex; gap: 6px; align-items: baseline; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
.stat b { color: var(--cyan); font-weight: normal; min-width: 6ch; text-align: right; }
.header-right { display: flex; gap: 12px; align-items: center; }
.header-right a { color: var(--dim); text-decoration: none; font-size: 10px; letter-spacing: 1px; transition: color .2s; }
.header-right a:hover { color: var(--cyan); }

/* ── Controls ───────────────────────────────────── */
.controls {
  padding: 8px 16px; display: flex; flex-wrap: wrap;
  gap: 8px 16px; align-items: center;
  border-bottom: 1px solid var(--border);
  background: rgba(2,4,8,0.9); flex-shrink: 0;
}
.ctrl-group { display: flex; align-items: center; gap: 6px; }
.ctrl-label { font-size: 10px; letter-spacing: 2px; color: var(--dim); white-space: nowrap; }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); align-self: center; }

/* Buttons */
.btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font); font-size: 11px;
  letter-spacing: 1px; padding: 5px 10px; cursor: pointer;
  transition: border-color .2s, color .2s, background .2s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border-hi); color: var(--cyan); }
.btn.active, .btn:active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.1); }
.btn.primary { border-color: var(--cyan); color: var(--cyan); }
.btn.danger:hover { border-color: var(--red); color: var(--red); }

/* Range */
input[type=range] {
  -webkit-appearance: none; width: 90px; height: 4px;
  background: rgba(0,229,255,0.15); border: 1px solid var(--border);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: var(--cyan); box-shadow: 0 0 6px var(--cyan); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: none;
  background: var(--cyan); box-shadow: 0 0 6px var(--cyan); cursor: pointer;
}

/* Text input */
input[type=text] {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font); font-size: 11px;
  padding: 5px 8px; outline: none; width: 140px;
  transition: border-color .2s;
}
input[type=text]::placeholder { color: var(--dim); }
input[type=text]:focus { border-color: var(--border-hi); }

/* Select */
select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font); font-size: 11px;
  padding: 5px 8px; outline: none; cursor: pointer;
}
select:focus { border-color: var(--border-hi); }
select option { background: #060c12; }

/* ── Canvas area ────────────────────────────────── */
.canvas-wrap {
  position: relative; flex: 1; overflow: hidden;
  background: var(--bg);
  cursor: crosshair;
}
.canvas-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none; z-index: 1;
}
canvas { display: block; }

.canvas-hint {
  position: absolute; bottom: 12px; right: 14px;
  font-size: 10px; color: var(--dim); letter-spacing: 1px;
  pointer-events: none; z-index: 2;
}

/* Layout column */
body { display: flex; flex-direction: column; }
</style>
</head>
<body>

<header>
  <div class="logo">◈ GAME OF LIFE</div>
  <div class="stats">
    <div class="stat">GEN <b id="s-gen">0</b></div>
    <div class="stat">ALIVE <b id="s-alive">0</b></div>
    <div class="stat">FPS <b id="s-fps">—</b></div>
  </div>
  <div class="header-right">
    <a href="https://profile.kamradtfamily.net">R. L. KAMRADT</a>
    <a href="https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life" target="_blank">RULES ↗</a>
  </div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <button class="btn primary" id="btn-play">▶ PLAY</button>
    <button class="btn" id="btn-step">⟩ STEP</button>
    <button class="btn danger" id="btn-clear">✕ CLEAR</button>
  </div>

  <div class="ctrl-sep"></div>

  <div class="ctrl-group">
    <span class="ctrl-label">SPEED</span>
    <input type="range" id="speed" min="1" max="60" value="15">
    <span id="speed-val" style="color:var(--dim);min-width:4ch">15/s</span>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">SIZE</span>
    <button class="btn size-btn" data-size="5">S</button>
    <button class="btn size-btn active" data-size="9">M</button>
    <button class="btn size-btn" data-size="15">L</button>
  </div>

  <div class="ctrl-sep"></div>

  <div class="ctrl-group">
    <span class="ctrl-label">SEED</span>
    <input type="text" id="seed-input" placeholder="type any text…" maxlength="80">
    <button class="btn" id="btn-seed">⟳ RANDOM</button>
  </div>

  <div class="ctrl-sep"></div>

  <div class="ctrl-group">
    <span class="ctrl-label">PATTERN</span>
    <select id="pattern-select">
      <option value="">— presets —</option>
      <optgroup label="Oscillators">
        <option value="blinker">Blinker (period 2)</option>
        <option value="toad">Toad (period 2)</option>
        <option value="beacon">Beacon (period 2)</option>
        <option value="pulsar">Pulsar (period 3)</option>
      </optgroup>
      <optgroup label="Spaceships">
        <option value="glider">Glider</option>
        <option value="lwss">Lightweight Spaceship</option>
      </optgroup>
      <optgroup label="Long-lived">
        <option value="r_pent">R-Pentomino (~1103 gen)</option>
        <option value="acorn">Acorn (~5206 gen)</option>
        <option value="diehard">Diehard (130 gen)</option>
      </optgroup>
      <optgroup label="Guns">
        <option value="gosper">Gosper Glider Gun</option>
      </optgroup>
      <optgroup label="Still lifes">
        <option value="block">Block</option>
        <option value="beehive">Beehive</option>
        <option value="loaf">Loaf</option>
      </optgroup>
    </select>
    <button class="btn" id="btn-stamp">⬤ STAMP</button>
  </div>
</div>

<div class="canvas-wrap" id="wrap">
  <canvas id="canvas"></canvas>
  <div class="canvas-hint">CLICK · DRAG TO DRAW &nbsp;|&nbsp; RIGHT-DRAG TO ERASE</div>
</div>

<script>
// ── PRNG — mulberry32 ────────────────────────────────────────────────────────
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 0x100000000;
  };
}

function hashStr(s) {
  let h = 0x811c9dc5 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h;
}

// ── Patterns (relative [x,y]) ────────────────────────────────────────────────
const PATTERNS = {
  block:   [[0,0],[1,0],[0,1],[1,1]],
  beehive: [[1,0],[2,0],[0,1],[3,1],[1,2],[2,2]],
  loaf:    [[1,0],[2,0],[0,1],[3,1],[1,2],[3,2],[2,3]],
  blinker: [[0,1],[1,1],[2,1]],
  toad:    [[1,0],[2,0],[3,0],[0,1],[1,1],[2,1]],
  beacon:  [[0,0],[1,0],[0,1],[3,2],[2,3],[3,3]],
  glider:  [[1,0],[2,1],[0,2],[1,2],[2,2]],
  lwss:    [[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],
  r_pent:  [[1,0],[2,0],[0,1],[1,1],[1,2]],
  acorn:   [[1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]],
  diehard: [[6,0],[0,1],[1,1],[1,2],[5,2],[6,2],[7,2]],
  pulsar: (()=>{
    const half = [
      [2,0],[3,0],[4,0],[8,0],[9,0],[10,0],
      [0,2],[5,2],[7,2],[12,2],
      [0,3],[5,3],[7,3],[12,3],
      [0,4],[5,4],[7,4],[12,4],
      [2,5],[3,5],[4,5],[8,5],[9,5],[10,5],
    ];
    const full = [...half];
    for (const [x,y] of half) { if (y!==0&&y!==5) full.push([x,12-y]); }
    return full;
  })(),
  gosper: [
    [24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],
    [11,3],[15,3],[20,3],[21,3],[34,3],[35,3],
    [0,4],[1,4],[10,4],[16,4],[20,4],[21,4],
    [0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],
    [10,6],[16,6],[24,6],
    [11,7],[15,7],
    [12,8],[13,8],
  ],
};

// ── State ────────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('wrap');

let CELL = 9;       // px per cell
let cols = 0, rows = 0;
let grid, next;     // Uint8Array
let running = false;
let stepTimer = null;
let generation = 0;
let lastFpsTime = performance.now();
let fpsFrames = 0;
let speed = 15;
let drawMode = null; // 1=draw, 0=erase

// ── Grid helpers ─────────────────────────────────────────────────────────────
function initGrid() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  cols = Math.floor(w / CELL);
  rows = Math.floor(h / CELL);
  canvas.width  = cols * CELL;
  canvas.height = rows * CELL;
  grid = new Uint8Array(cols * rows);
  next = new Uint8Array(cols * rows);
}

function idx(x, y) {
  return ((y + rows) % rows) * cols + ((x + cols) % cols);
}

function countNeighbors(x, y) {
  return grid[idx(x-1,y-1)] + grid[idx(x,y-1)] + grid[idx(x+1,y-1)]
       + grid[idx(x-1,y  )]                     + grid[idx(x+1,y  )]
       + grid[idx(x-1,y+1)] + grid[idx(x,y+1)] + grid[idx(x+1,y+1)];
}

function step() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const n = countNeighbors(x, y);
      const alive = grid[idx(x, y)];
      next[idx(x, y)] = alive ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
    }
  }
  const tmp = grid; grid = next; next = tmp;
  generation++;
}

function countAlive() {
  let c = 0;
  for (let i = 0; i < grid.length; i++) c += grid[i];
  return c;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const gap = CELL > 5 ? 1 : 0;
  const cs  = CELL - gap;

  ctx.fillStyle = '#020408';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw faint grid lines when cells are large enough
  if (CELL >= 9) {
    ctx.fillStyle = 'rgba(0,229,255,0.05)';
    for (let x = 0; x <= cols; x++) ctx.fillRect(x*CELL, 0, 1, canvas.height);
    for (let y = 0; y <= rows; y++) ctx.fillRect(0, y*CELL, canvas.width, 1);
  }

  ctx.fillStyle = '#00e5ff';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y * cols + x]) {
        ctx.fillRect(x * CELL, y * CELL, cs, cs);
      }
    }
  }

  // Stats
  const alive = countAlive();
  document.getElementById('s-gen').textContent   = generation.toLocaleString();
  document.getElementById('s-alive').textContent = alive.toLocaleString();

  // FPS
  fpsFrames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('s-fps').textContent = fpsFrames;
    fpsFrames = 0;
    lastFpsTime = now;
  }
}

// ── RAF loop ─────────────────────────────────────────────────────────────────
function loop() {
  render();
  requestAnimationFrame(loop);
}

// ── Simulation timer ──────────────────────────────────────────────────────────
function setSpeed(s) {
  speed = s;
  document.getElementById('speed-val').textContent = s + '/s';
  document.getElementById('speed').value = s;
  if (running) startTimer();
}

function startTimer() {
  clearInterval(stepTimer);
  stepTimer = setInterval(step, 1000 / speed);
}

function play() {
  running = true;
  startTimer();
  document.getElementById('btn-play').textContent = '⏸ PAUSE';
  document.getElementById('btn-play').classList.add('active');
}

function pause() {
  running = false;
  clearInterval(stepTimer);
  document.getElementById('btn-play').textContent = '▶ PLAY';
  document.getElementById('btn-play').classList.remove('active');
}

function toggle() { running ? pause() : play(); }

// ── Fill helpers ─────────────────────────────────────────────────────────────
function fillRandom(rng, density = 0.3) {
  for (let i = 0; i < grid.length; i++) grid[i] = rng() < density ? 1 : 0;
  generation = 0;
}

function stampPattern(name, cx, cy) {
  const cells = PATTERNS[name];
  if (!cells) return;
  // bounding box
  const maxX = Math.max(...cells.map(([x]) => x));
  const maxY = Math.max(...cells.map(([,y]) => y));
  const ox = Math.floor(cx - maxX / 2);
  const oy = Math.floor(cy - maxY / 2);
  for (const [px, py] of cells) {
    const gx = ox + px, gy = oy + py;
    if (gx >= 0 && gx < cols && gy >= 0 && gy < rows)
      grid[gy * cols + gx] = 1;
  }
}

// ── Canvas mouse interaction ──────────────────────────────────────────────────
function canvasCell(e) {
  const rect = canvas.getBoundingClientRect();
  return [Math.floor((e.clientX - rect.left) / CELL),
          Math.floor((e.clientY - rect.top)  / CELL)];
}

canvas.addEventListener('mousedown', e => {
  const [x, y] = canvasCell(e);
  drawMode = e.button === 2 ? 0 : 1;
  if (x >= 0 && x < cols && y >= 0 && y < rows)
    grid[y * cols + x] = drawMode;
  e.preventDefault();
});

canvas.addEventListener('mousemove', e => {
  if (drawMode === null || !(e.buttons & (1|2))) return;
  const [x, y] = canvasCell(e);
  if (x >= 0 && x < cols && y >= 0 && y < rows)
    grid[y * cols + x] = drawMode;
});

canvas.addEventListener('mouseup',    () => { drawMode = null; });
canvas.addEventListener('mouseleave', () => { drawMode = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Touch support
canvas.addEventListener('touchstart', e => {
  drawMode = 1;
  const t = e.touches[0];
  const [x, y] = canvasCell(t);
  if (x >= 0 && x < cols && y >= 0 && y < rows) grid[y * cols + x] = 1;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  const [x, y] = canvasCell(t);
  if (x >= 0 && x < cols && y >= 0 && y < rows) grid[y * cols + x] = 1;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', () => { drawMode = null; });

// ── Controls wiring ───────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', toggle);

document.getElementById('btn-step').addEventListener('click', () => {
  pause();
  step();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  pause();
  grid.fill(0);
  generation = 0;
});

document.getElementById('btn-seed').addEventListener('click', () => {
  const text = document.getElementById('seed-input').value.trim();
  const seed = text ? hashStr(text) : (Math.random() * 0xffffffff) >>> 0;
  if (!text) document.getElementById('seed-input').value = '';
  fillRandom(mulberry32(seed));
  if (!running) play();
});

document.getElementById('btn-stamp').addEventListener('click', () => {
  const name = document.getElementById('pattern-select').value;
  if (name) stampPattern(name, Math.floor(cols / 2), Math.floor(rows / 2));
});

document.getElementById('pattern-select').addEventListener('dblclick', () => {
  document.getElementById('btn-stamp').click();
});

document.getElementById('speed').addEventListener('input', e => {
  setSpeed(parseInt(e.target.value));
});

document.getElementById('seed-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-seed').click();
});

document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const wasRunning = running;
    pause();
    CELL = parseInt(btn.dataset.size);
    initGrid();
    fillRandom(mulberry32((Math.random() * 0xffffffff) >>> 0));
    if (wasRunning) play();
  });
});

// ── Resize ────────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const wasRunning = running;
    pause();
    initGrid();
    fillRandom(mulberry32((Math.random() * 0xffffffff) >>> 0));
    if (wasRunning) play();
  }, 200);
});

// ── Init ──────────────────────────────────────────────────────────────────────
initGrid();
fillRandom(mulberry32((Math.random() * 0xffffffff) >>> 0));
play();
requestAnimationFrame(loop);
</script>
</body>
</html>
